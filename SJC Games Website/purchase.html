```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Purchase | SJC Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: white !important;
            color: black !important;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            text-align: center;
            padding: 30px 20px 20px;
            border-bottom: 2px solid black;
        }

        .logo {
            width: 180px;
            max-width: 70%;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 40px;
        }

        .purchase-box {
            border: 2px solid black;
            padding: 40px 30px;
        }

        .purchase-box h2 {
            font-size: 30px;
            margin-top: 0;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin: 25px 0;
        }

        .message {
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .back-button {
            display: inline-block;
            border: 2px solid black;
            padding: 12px 20px;
            color: black;
            text-decoration: none;
            font-weight: bold;
        }

        .back-button:hover {
            background: black;
            color: white;
        }

        footer {
            border-top: 2px solid black;
            text-align: center;
            padding: 25px 20px;
            margin-top: 70px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            header {
                padding: 20px 15px 15px;
            }

            .logo {
                width: 150px;
                margin-bottom: 15px;
            }

            nav {
                gap: 15px;
            }

            nav a {
                font-size: 13px;
            }

            main {
                margin: 40px auto;
                padding: 0 15px;
            }

            h1 {
                font-size: 32px;
            }

            .purchase-box {
                padding: 30px 20px;
            }

            .purchase-box h2 {
                font-size: 25px;
            }

            .price {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<header>

    <img
        src="sjc-logo.png"
        alt="SJC Games Logo"
        class="logo"
    >

    <nav>
        <a href="index.html">HOME</a>
        <a href="games.html">GAMES</a>
        <a href="news.html">NEWS</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
    </nav>

</header>

<main>

    <h1>PURCHASE</h1>

    <div class="purchase-box">

        <h2 id="game-name">Game</h2>

        <div
            class="price"
            id="game-price"
        >
            £0.00
        </div>

        <p class="message">
            This game is not available for purchase yet.
            SJC Games will provide the purchase option when
            the game is ready to be released.
        </p>

        <a
            class="back-button"
            href="games.html"
        >
            BACK TO GAMES
        </a>

    </div>

</main>

<footer>
    © 2026 SJC Games. All rights reserved.
</footer>

<script>

const parameters = new URLSearchParams(
    window.location.search
);

const game = parameters.get("game");
const price = parameters.get("price");

if (game) {
    document.getElementById("game-name").textContent = game;
}

if (price) {
    document.getElementById("game-price").textContent =
        "£" + price;
}

</script>

</body>
</html>
```
