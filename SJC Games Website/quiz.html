```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join SJC Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: white !important;
            color: black !important;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            text-align: center;
            padding: 30px 20px 20px;
            border-bottom: 2px solid black;
        }

        .logo {
            width: 180px;
            max-width: 70%;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 850px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 15px;
        }

        .intro {
            text-align: center;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        form {
            border: 2px solid black;
            padding: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 25px;
            border: 2px solid black;
            background: white;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 2px solid black;
            background: black;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: white;
            color: black;
        }

        footer {
            border-top: 2px solid black;
            text-align: center;
            padding: 25px 20px;
            margin-top: 70px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            header {
                padding: 20px 15px 15px;
            }

            .logo {
                width: 150px;
                margin-bottom: 15px;
            }

            nav {
                gap: 15px;
            }

            nav a {
                font-size: 13px;
            }

            main {
                margin: 35px auto;
                padding: 0 15px;
            }

            h1 {
                font-size: 32px;
            }

            form {
                padding: 20px;
            }

            input,
            select,
            textarea {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<header>

    <img
        src="sjc-logo.png"
        alt="SJC Games Logo"
        class="logo"
    >

    <nav>
        <a href="index.html">HOME</a>
        <a href="games.html">GAMES</a>
        <a href="news.html">NEWS</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
    </nav>

</header>

<main>

    <h1>JOIN SJC GAMES</h1>

    <p class="intro">
        Interested in becoming part of SJC Games?
        Fill out the form below and tell us a little about yourself.
    </p>

    <form
        action="https://formspree.io/f/mgavlpjd"
        method="POST"
    >

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="role">What would you like to do?</label>
        <select
            id="role"
            name="role"
            required
        >
            <option value="">Select one</option>
            <option value="Programming">Programming</option>
            <option value="Game Design">Game Design</option>
            <option value="Art">Art</option>
            <option value="3D Modelling">3D Modelling</option>
            <option value="Music / Sound">Music / Sound</option>
            <option value="Other">Other</option>
        </select>

        <label for="experience">Experience level</label>
        <select
            id="experience"
            name="experience"
            required
        >
            <option value="">Select one</option>
            <option value="None">None</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
        </select>

        <label for="why_join">
            Why do you want to join SJC Games?
        </label>

        <textarea
            id="why_join"
            name="why_join"
            required
        ></textarea>

        <label for="team_contribution">
            What could you contribute to the team?
        </label>

        <textarea
            id="team_contribution"
            name="team_contribution"
            required
        ></textarea>

        <label for="game_idea">
            Tell us about a game idea you have.
        </label>

        <textarea
            id="game_idea"
            name="game_idea"
            required
        ></textarea>

        <label for="disagreement">
            What would you do if you disagreed with another team member?
        </label>

        <select
            id="disagreement"
            name="disagreement"
            required
        >
            <option value="">Select one</option>
            <option value="Listen and discuss">
                Listen and discuss
            </option>
            <option value="Compromise">
                Compromise
            </option>
            <option value="Explain my idea">
                Explain my idea
            </option>
            <option value="Other">
                Other
            </option>
        </select>

        <label for="why_you">
            Why should we choose you?
        </label>

        <textarea
            id="why_you"
            name="why_you"
            required
        ></textarea>

        <button type="submit">
            SUBMIT APPLICATION
        </button>

    </form>

</main>

<footer>
    © 2026 SJC Games. All rights reserved.
</footer>

</body>
</html>
```
